<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Omni Agent Mobile Node</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 26px;
        letter-spacing: 0;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      input,
      textarea,
      button {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      textarea {
        min-height: 92px;
        resize: vertical;
      }
      button {
        border: 0;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      pre {
        min-height: 160px;
        overflow: auto;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px;
        background: #0f172a;
        color: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #020617;
          color: #e2e8f0;
        }
        input,
        textarea {
          background: #0f172a;
          color: #e2e8f0;
          border-color: #334155;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Omni Agent Mobile Node</h1>
      <form id="settings">
        <label>
          Gateway URL
          <input id="gatewayUrl" name="gatewayUrl" placeholder="http://localhost:4318" autocomplete="url" />
        </label>
        <label>
          Device endpoint URL
          <input id="endpointUrl" name="endpointUrl" placeholder="https://device.example.com/omni-delivery" autocomplete="url" />
        </label>
        <label>
          Device ID
          <input id="deviceId" name="deviceId" placeholder="iphone-15-pro" autocomplete="off" />
        </label>
        <label>
          Shared secret
          <input id="secret" name="secret" type="password" autocomplete="current-password" />
        </label>
        <label>
          Event JSON
          <textarea id="eventPayload" name="eventPayload">{"type":"notification_opened","deliveryId":"demo-delivery"}</textarea>
        </label>
        <div class="actions">
          <button id="registerDevice" type="button">Register</button>
          <button id="sendEvent" type="button">Send Event</button>
        </div>
      </form>
      <pre id="output" aria-live="polite">{}</pre>
    </main>
    <script src="./src/app.js" type="module"></script>
  </body>
</html>
