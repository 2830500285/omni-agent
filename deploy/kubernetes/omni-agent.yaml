apiVersion: v1
kind: Secret
metadata:
  name: omni-agent-secrets
type: Opaque
stringData:
  OMNI_AGENT_GATEWAY_ACCESS_TOKEN: change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-agent-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-agent-gateway
  template:
    metadata:
      labels:
        app: omni-agent-gateway
    spec:
      containers:
        - name: gateway
          image: omni-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/gateway/dist/index.js"]
          ports:
            - containerPort: 4318
          env:
            - name: NODE_ENV
              value: production
            - name: OMNI_AGENT_GATEWAY_HOST
              value: 0.0.0.0
            - name: OMNI_AGENT_GATEWAY_PORT
              value: "4318"
            - name: OMNI_AGENT_GATEWAY_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omni-agent-secrets
                  key: OMNI_AGENT_GATEWAY_ACCESS_TOKEN
            - name: OMNI_AGENT_WORKSPACE_ROOT
              value: /workspace
            - name: OMNI_AGENT_STORE_PATH
              value: /data/session-store.sqlite
            - name: OMNI_AGENT_EXECUTION_BACKEND
              value: local
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /health
              port: 4318
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 4318
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omni-agent-data
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: omni-agent-gateway
spec:
  selector:
    app: omni-agent-gateway
  ports:
    - name: http
      port: 4318
      targetPort: 4318
