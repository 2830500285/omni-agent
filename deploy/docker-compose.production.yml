services:
  omni-agent-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: omni-agent:latest
    restart: unless-stopped
    command: ["node", "apps/gateway/dist/index.js"]
    ports:
      - "${OMNI_AGENT_GATEWAY_PORT:-4318}:4318"
    environment:
      NODE_ENV: production
      OMNI_AGENT_GATEWAY_HOST: 0.0.0.0
      OMNI_AGENT_GATEWAY_PORT: 4318
      OMNI_AGENT_GATEWAY_ACCESS_TOKEN: ${OMNI_AGENT_GATEWAY_ACCESS_TOKEN:?set gateway token}
      OMNI_AGENT_WORKSPACE_ROOT: /workspace
      OMNI_AGENT_STORE_PATH: /data/session-store.sqlite
      OMNI_AGENT_EXECUTION_BACKEND: ${OMNI_AGENT_EXECUTION_BACKEND:-local}
      OMNI_AGENT_MODAL_ENDPOINT: ${OMNI_AGENT_MODAL_ENDPOINT:-}
      OMNI_AGENT_E2B_ENDPOINT: ${OMNI_AGENT_E2B_ENDPOINT:-}
      OMNI_AGENT_DAYTONA_ENDPOINT: ${OMNI_AGENT_DAYTONA_ENDPOINT:-}
      OMNI_AGENT_CODESANDBOX_ENDPOINT: ${OMNI_AGENT_CODESANDBOX_ENDPOINT:-}
    volumes:
      - omni-agent-data:/data
      - omni-agent-workspace:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  omni-agent-data:
  omni-agent-workspace:
